<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FP2 consistency check</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  table { border-collapse: collapse; } td, th { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  .ok { color: #070; font-weight: 600; } .bad { color: #b00; font-weight: 600; }
  pre { background: #f4f4f4; padding: 8px; }
</style>
<script src="../fp2.js"></script>
</head>
<body>
<h1>FP2 JS vs Python check</h1>
<p>Fingerprints TCGdex low.png images in the browser and compares them with data/fp2-en.bin (built in Python).</p>
<table id="t"><thead><tr><th>card</th><th>own-record dist (plain)</th><th>max |byte diff|</th><th>bytes differing</th><th>top-1 (search)</th><th>top-1 dist</th><th>2nd</th><th>fingerprint ms</th><th>search ms</th></tr></thead><tbody></tbody></table>
<pre id="log"></pre>
<script>
const CARDS = [["sm4-115", "sm/sm4/115"], ["sm4-57", "sm/sm4/57"], ["sv03.5-199", "sv/sv03.5/199"],
               ["sv03-223", "sv/sv03/223"], ["swsh1-211", "swsh/swsh1/211"]];
const log = (s) => { document.getElementById("log").textContent += s + "\n"; };
function loadImg(url) {
  return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => rej(new Error("load " + url)); im.src = url; });
}
(async () => {
  const [ids, buf] = await Promise.all([fetch("../data/ids-en.json").then(r => r.json()),
                                        fetch("../data/fp2-en.bin").then(r => r.arrayBuffer())]);
  const db = new Uint8Array(buf), R = FP2.RECORD_BYTES, dbi = new Int8Array(buf);
  log(`DB: ${ids.length} ids, ${db.length} bytes, ${db.length / R} records of ${R} B`);
  const results = [];
  for (const [id, path] of CARDS) {
    const im = await loadImg(`https://assets.tcgdex.net/en/${path}/low.png`);
    let t0 = performance.now();
    const fp = FP2.fingerprint(im);
    const tf = performance.now() - t0;
    const idx = ids.indexOf(id), off = idx * R, rec = FP2.record(fp);
    let maxd = 0, nd = 0;
    for (let j = 0; j < R; j++) { const d = Math.abs(rec[j] - dbi[off + j]); if (d) nd++; if (d > maxd) maxd = d; }
    const own = FP2.distance(rec, db, off);
    t0 = performance.now();
    const top = FP2.search(fp, db, 5);
    const ts = performance.now() - t0;
    const ok = ids[top[0].index] === id;
    results.push({ id, own, maxd, nd, top1: ids[top[0].index], ok, tf, ts });
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${id}</td><td>${own}</td><td>${maxd}</td><td>${nd}/${R}</td>
      <td class="${ok ? "ok" : "bad"}">${ids[top[0].index]}</td><td>${top[0].distance}</td>
      <td>${ids[top[1].index]} (${top[1].distance})</td><td>${tf.toFixed(1)}</td><td>${ts.toFixed(1)}</td>`;
    document.querySelector("#t tbody").appendChild(tr);
  }
  // timing: repeated full-DB scans
  const fp = FP2.fingerprint(await loadImg("https://assets.tcgdex.net/en/sm/sm4/115/low.png"));
  const times = [];
  for (let i = 0; i < 5; i++) { const t0 = performance.now(); FP2.search(fp, db, 5); times.push(performance.now() - t0); }
  let t0 = performance.now(); let s = 0;
  for (let r = 0; r < ids.length; r++) s += FP2.distance(FP2.record(fp), db, r * R);
  const tPlain = performance.now() - t0;
  log("search() ms x5: " + times.map(t => t.toFixed(1)).join(", "));
  log("plain single-variant distance() over full DB ms: " + tPlain.toFixed(1));
  window.FP2_CHECK = { results, searchMs: times, plainScanMs: tPlain,
    pass: results.every(r => r.ok && r.own === 0) };
  log("PASS = " + window.FP2_CHECK.pass);
})().catch(e => { log("ERROR " + e.message); window.FP2_CHECK = { error: e.message }; });
</script>
</body>
</html>
